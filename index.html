<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐾 Guardianes de la biodiversidad — Yasmina Fdez</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#06251d,#155b43);color:#fff;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:25px 16px 40px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.tag{color:#a9dfc7;font-weight:bold;font-size:13px}.title{font-size:clamp(30px,6vw,48px);margin:8px 0}.intro{color:#c8e5d8;line-height:1.5}.score{background:#164735;padding:12px 20px;border-radius:16px;text-align:center}.score small{display:block}.score b{font-size:28px}.progress{height:10px;background:#245b49;border-radius:20px;margin:18px 0;overflow:hidden}.bar{height:100%;width:0;background:#8bea78;transition:.3s}.card{background:#123a2e;border:1px solid #39715d;border-radius:22px;padding:25px}.animal{font-size:60px}.category{font-size:12px;color:#a9dfc7;font-weight:bold;text-transform:uppercase;margin-top:10px}.question{font-size:22px;font-weight:bold;line-height:1.4}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{padding:16px;border-radius:14px;border:1px solid #477b68;background:#092a21;color:#fff;text-align:left;font-size:16px;cursor:pointer}.answer:hover{border-color:#8bea78}.answer:disabled{cursor:default}.feedback{min-height:55px;padding-top:15px;font-weight:bold;line-height:1.5}.next,.restart{display:none;background:#8bea78;color:#082217;border:0;border-radius:13px;padding:13px 20px;font-weight:bold;font-size:15px;cursor:pointer}.show{display:inline-block}.final{text-align:center}.final .medal{font-size:75px}.final h2{font-size:32px}.final .points{font-size:26px;font-weight:bold}footer{text-align:center;color:#9bcbbb;margin-top:16px;font-size:12px}@media(max-width:600px){.top{align-items:flex-start}.answers{grid-template-columns:1fr}.card{padding:18px}.question{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div><div class="tag">DÍA DE LOS ANIMALES EN PELIGRO</div><div class="title">🐾 Guardianes de la biodiversidad</div><p class="intro">¡Completa los 30 retos y demuestra cuánto sabes sobre especies amenazadas y conservación!</p></div>
<div class="score"><small>PUNTOS</small><b id="score">0</b></div>
</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="game" class="card"></div>
<footer>Actividad educativa · Yasmina Fdez</footer>
</div>
<script>
const Q=[["🐼", "Animales en peligro", "¿Qué significa que una especie esté en peligro de extinción?", ["Que vive en un solo país", "Que existe un riesgo elevado de desaparecer", "Que acaba de descubrirse", "Que vive siempre en cautividad"], 1], ["🐢", "Animales en peligro", "¿Qué animal es un reptil marino?", ["Oso polar", "Lince ibérico", "Tortuga marina", "Gorila"], 2], ["🦧", "Animales en peligro", "¿Qué animal depende especialmente de los bosques tropicales?", ["Orangután", "Pingüino emperador", "Foca monje", "Oso polar"], 0], ["🐋", "Animales en peligro", "¿Cuál de estos animales es un mamífero marino?", ["Atún", "Pulpo", "Medusa", "Ballena"], 3], ["🦅", "Animales en peligro", "¿Qué grupo de animales incluye a las águilas?", ["Anfibios", "Aves", "Reptiles", "Mamíferos"], 1], ["🐆", "Animales en peligro", "¿Qué tipo de animal es el lince?", ["Mamífero", "Ave", "Anfibio", "Pez"], 0], ["🐘", "Animales en peligro", "¿Cuál es una amenaza para muchas poblaciones de elefantes?", ["La fotosíntesis", "La lluvia", "La caza furtiva", "La migración natural"], 2], ["🦍", "Animales en peligro", "¿Qué necesitan las especies para mantener poblaciones saludables?", ["Solo agua", "Hábitat, alimento y condiciones adecuadas", "Solo refugios artificiales", "Ningún recurso"], 1], ["🐧", "Animales en peligro", "¿Qué factor afecta especialmente a especies dependientes del hielo?", ["El aumento de la temperatura", "La rotación terrestre", "Las mareas normales", "La gravedad"], 0], ["🦏", "Animales en peligro", "¿Cuál es una característica de una especie amenazada?", ["Su población puede disminuir hasta desaparecer", "Siempre aumenta su población", "No necesita alimento", "No tiene depredadores"], 0], ["🌳", "Causas de la extinción", "¿Qué es la pérdida de hábitat?", ["Cuando una especie cambia de color", "Cuando desaparece o se degrada el lugar donde vive", "Cuando nace una cría", "Cuando cambia el tiempo un día"], 1], ["🏭", "Causas de la extinción", "¿Cuál puede ser una fuente de contaminación?", ["Una reserva natural", "Un bosque protegido", "Un vertido industrial", "Una zona de reproducción"], 2], ["🌡️", "Causas de la extinción", "¿Cómo puede afectar el cambio climático a las especies?", ["Puede modificar sus hábitats y disponibilidad de recursos", "Nunca afecta a los animales", "Solo cambia el color de las plantas", "Elimina la gravedad"], 0], ["🪓", "Causas de la extinción", "¿Qué actividad puede provocar deforestación?", ["Reforestación", "Creación de corredores", "Protección de bosques", "Tala de grandes superficies"], 3], ["🎣", "Causas de la extinción", "¿Qué es la sobrepesca?", ["Pescar menos de lo necesario", "Capturar peces a un ritmo que puede impedir la recuperación de sus poblaciones", "Proteger zonas marinas", "Observar peces"], 1], ["🛢️", "Causas de la extinción", "¿Qué puede ocurrir tras un vertido de petróleo en el mar?", ["Contaminación y daños a organismos marinos", "Aumento de biodiversidad inmediato", "Creación de agua potable", "Ningún efecto"], 0], ["🚧", "Causas de la extinción", "¿Por qué las carreteras pueden afectar a la fauna?", ["Porque producen fotosíntesis", "Porque pueden fragmentar hábitats y causar atropellos", "Porque crean bosques", "Porque aumentan siempre el alimento"], 1], ["🐍", "Causas de la extinción", "¿Qué son las especies invasoras?", ["Especies que nunca se reproducen", "Especies introducidas que pueden causar impactos en nuevos ecosistemas", "Animales domésticos únicamente", "Especies extinguidas"], 1], ["🔥", "Causas de la extinción", "¿Qué efecto pueden tener incendios intensos y repetidos?", ["Pueden destruir hábitats y reducir poblaciones", "Siempre aumentan la biodiversidad", "Crean ecosistemas maduros inmediatamente", "No afectan al suelo"], 0], ["🌊", "Causas de la extinción", "¿Qué residuo puede causar problemas a animales marinos?", ["Plástico", "Oxígeno", "Arena limpia", "Luz solar"], 0], ["🧬", "Ciencia y biodiversidad", "¿Qué es la biodiversidad?", ["La variedad de seres vivos, genes y ecosistemas", "El número de edificios", "La cantidad de agua de un vaso", "Solo el número de mamíferos"], 0], ["🌱", "Ciencia y biodiversidad", "¿Qué es un ecosistema?", ["Solo un animal", "Una roca aislada", "Los seres vivos y el medio con el que interactúan", "Una especie doméstica"], 2], ["🔬", "Ciencia y biodiversidad", "¿Qué estudia la ecología?", ["Las estrellas únicamente", "Las relaciones de los seres vivos entre sí y con su ambiente", "Solo las rocas", "La historia de los inventos"], 1], ["🐝", "Ciencia y biodiversidad", "¿Por qué son importantes muchos insectos polinizadores?", ["Ayudan a la reproducción de muchas plantas", "Eliminan todo el oxígeno", "Impiden que germinen las semillas", "Solo viven en el océano"], 0], ["🧪", "Ciencia y biodiversidad", "¿Qué permite conocer el tamaño de una población?", ["Contar o estimar sus individuos mediante métodos científicos", "Mirar una fotografía al azar", "Ignorar los datos", "Solo observar un individuo"], 0], ["🏞️", "Conservación", "¿Qué es un área protegida?", ["Un lugar destinado a conservar valores naturales", "Una fábrica", "Una zona sin ningún ser vivo", "Un centro comercial"], 0], ["🌿", "Conservación", "¿Qué acción ayuda a recuperar un bosque degradado?", ["Eliminar toda la vegetación", "Reforestar con especies adecuadas y restaurar el ecosistema", "Introducir basura", "Aumentar la contaminación"], 1], ["🦋", "Conservación", "¿Qué puede favorecer un corredor ecológico?", ["Conectar hábitats y facilitar el movimiento de animales", "Aislar todas las poblaciones", "Destruir bosques", "Eliminar refugios"], 0], ["🚯", "Conservación", "¿Cuál es una buena acción para reducir el impacto sobre la fauna?", ["Dejar residuos en la naturaleza", "Comprar animales salvajes", "Reducir residuos y respetar los espacios naturales", "Alimentar siempre a animales silvestres"], 2], ["🌍", "Conservación", "¿Cuál es el objetivo principal de conservar especies amenazadas?", ["Evitar su desaparición y mantener la biodiversidad", "Hacer que todas sean mascotas", "Eliminar sus hábitats", "Aumentar la contaminación"], 0]];
let order=[],current=0,points=0,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle([...Array(Q.length).keys()]);current=0;points=0;document.getElementById("score").textContent=0;show()}
function show(){
locked=false;let q=Q[order[current]], opts=shuffle(q[3].map((x,i)=>({x,i})));
document.getElementById("bar").style.width=((current+1)/Q.length*100)+"%";
let g=document.getElementById("game");
g.innerHTML='<div class="animal">'+q[0]+'</div><div class="category">'+q[1]+' · Pregunta '+(current+1)+' de 30</div><div class="question">'+q[2]+'</div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button id="next" class="next">Siguiente reto →</button>';
let box=document.getElementById("answers");
opts.forEach(o=>{let b=document.createElement("button");b.className="answer";b.textContent=o.x;b.onclick=()=>answer(o.i);box.appendChild(b)});
document.getElementById("next").onclick=()=>{current++;current<Q.length?show():finish()}
}
function answer(i){
if(locked)return;locked=true;let q=Q[order[current]],fb=document.getElementById("feedback");
document.querySelectorAll(".answer").forEach(b=>b.disabled=true);
if(i===q[4]){points++;document.getElementById("score").textContent=points;fb.textContent="✅ ¡Correcto! +1 punto.";fb.style.color="#8bea78"}
else{fb.textContent="❌ No es correcto. La respuesta adecuada es: "+q[3][q[4]]+".";fb.style.color="#ffb0b0"}
document.getElementById("next").classList.add("show")
}
function finish(){
let title=points>=27?"🏆 Guardián experto":points>=22?"🌟 Guardián de la biodiversidad":points>=16?"🌿 Protector de la naturaleza":"🔎 Explorador de la biodiversidad";
document.getElementById("bar").style.width="100%";
document.getElementById("game").innerHTML='<div class="final"><div class="medal">🏆</div><h2>¡Misión completada!</h2><div class="points">'+points+' / 30 puntos</div><p>'+title+'</p><p>¡Cada especie cuenta! Proteger los hábitats y respetar la naturaleza ayuda a conservar la biodiversidad.</p><button id="restart" class="restart show">🔄 Volver a jugar</button></div>';
document.getElementById("restart").onclick=start
}
start();
</script>
</body>
</html>
